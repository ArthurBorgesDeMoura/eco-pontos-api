spring.application.name=ecoponto-backend
spring.profiles.active=dev

server.port=${ECOPONTO_API_PORTA:8080}

server.tomcat.max-http-form-post-size=64KB
spring.servlet.multipart.enabled=false

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.tracking-modes=cookie

spring.datasource.hikari.pool-name=ecoponto
spring.datasource.hikari.connection-timeout=3000
spring.sql.init.mode=never

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
spring.jpa.properties.jakarta.persistence.database-product-name=MariaDB
spring.jpa.properties.jakarta.persistence.database-major-version=10
spring.jpa.properties.jakarta.persistence.database-minor-version=11
logging.level.org.hibernate.engine.jdbc.spi.SqlExceptionHelper=off

ecoponto.senha.custo-bcrypt=${ECOPONTO_BCRYPT_CUSTO:12}

ecoponto.login.falhas-para-bloquear=5
ecoponto.login.bloqueio=5m
